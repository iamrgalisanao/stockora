# Stockora — production stack, fronted by the VPS's OWN APACHE (not Traefik).
#
# Confirmed on srv1423476 (2026-09-05): Apache — not the `traefik` container —
# owns host ports 80/443 (`ss -tlnp` showed apache2, and `docker port traefik`
# is empty). Every other app on this box (itrack, ipos, crmsales, ...) is
# published to a loopback port and reverse-proxied by an Apache vhost using
# ProxyPass/ProxyPassReverse, with TLS via certbot's Apache plugin. This stack
# follows the exact same pattern — see docs/DEPLOY-HOSTINGER.md for the vhost
# + certbot steps.
#
#   Apache vhost  https://${APP_HOST}/     -> 127.0.0.1:${WEB_HOST_PORT} -> web  (Next.js, :3000)
#   Apache vhost  https://${APP_HOST}/api  -> 127.0.0.1:${API_HOST_PORT} -> api  (NestJS, :4000)
#   DB  : postgres (internal only, never published to the host)
#
# Run from the repo root:
#   docker compose --env-file deploy/.env.prod -f deploy/docker-compose.prod.yml up -d --build
# ---------------------------------------------------------------------------
name: stockora

networks:
  internal:
    driver: bridge

volumes:
  stockora_pgdata:

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [internal]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - stockora_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    image: stockora-api:latest
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks: [internal]
    ports:
      # Loopback-only — Apache, on this same host, is the sole consumer.
      - "127.0.0.1:${API_HOST_PORT:-18400}:4000"
    environment:
      NODE_ENV: production
      API_PORT: "4000"
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public"
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-1d}
      CORS_ORIGIN: ${APP_URL}

  web:
    build:
      context: ..
      dockerfile: apps/web/Dockerfile
      args:
        # Baked into the client bundle at build time — the public origin only.
        NEXT_PUBLIC_API_URL: ${APP_URL}
    image: stockora-web:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-18300}:3000"
