services:
  postgres:
    image: postgres:16-alpine
    container_name: iw_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-iw_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-iw_password}
      POSTGRES_DB: ${POSTGRES_DB:-inventory_warehouse}
    ports:
      # Host 5544 -> container 5432 (5432/5433 are used by other local projects here)
      - "${POSTGRES_PORT:-5544}:5432"
    volumes:
      - iw_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-iw_user} -d ${POSTGRES_DB:-inventory_warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iw_pgdata:
